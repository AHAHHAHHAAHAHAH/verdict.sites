# Every morning: read every model on sale in the brands' own stores, with today's price and
# discount (scripts/fetch-stores.mjs), and commit them so the next build publishes them. Prices
# older than a week and discounts older than two days are never shown, so a missed run hides
# them instead of publishing stale ones.
name: stores

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stores:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      # sharp tells a black or white machine from the store's picture when the store does not name its colour.
      - run: npm ci
      - name: Read the brand stores
        run: node scripts/fetch-stores.mjs
      - name: Commit
        run: |
          git config user.name "Webora Studio"
          git config user.email "weboracode@gmail.com"
          git add src/sites/*/models.json src/sites/*/prices.json
          if ! git diff --cached --quiet; then
            git commit -m "Store prices of $(date -u +%F)"
            git push
          fi
